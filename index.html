<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy Policy</title>
<meta name="description" content="Privacy Policy for Discord applications">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #ececec;
    --muted: #8a8f98;
    --line: #1f2228;
    --accent: #5b8cff;
    --panel: #0a0c10;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 24px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 24px 80px;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 64px;
  }

  header.top {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--line);
  }
  .bot { display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 500; }
  .shield {
    width: 36px; height: 36px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  h1 {
    font-family: "Unbounded", "Onest", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 6vw, 64px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 28px 0 16px;
  }
  .meta { color: var(--muted); font-size: 15px; margin: 0; }

  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .lang button {
    font: inherit; font-size: 14px; font-weight: 500;
    background: none; color: var(--muted); border: 0; cursor: pointer;
    padding: 6px 14px; border-radius: 999px;
  }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 32px); align-self: start; }
  nav.toc ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  nav.toc li { counter-increment: s; }
  nav.toc a {
    display: flex; gap: 10px;
    color: var(--muted); text-decoration: none;
    font-size: 14px; line-height: 1.4; padding: 7px 0;
  }
  nav.toc a::before { content: counter(s) "."; min-width: 18px; color: #4a4f57; }
  nav.toc a:hover, nav.toc a.active { color: var(--text); }

  main { max-width: 68ch; }
  .lead { font-size: 19px; color: var(--text); margin: 0 0 48px; }
  section { counter-increment: sec; padding-top: 8px; margin-bottom: 44px; }
  main { counter-reset: sec; }
  h2 {
    font-family: "Unbounded", "Onest", system-ui, sans-serif;
    font-weight: 500;
    font-size: 21px;
    line-height: 1.3;
    margin: 0 0 14px;
    display: flex; gap: 14px;
  }
  h2::before { content: counter(sec); color: var(--accent); min-width: 22px; }
  p { margin: 0 0 14px; }
  ul, main ol { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 8px; }
  li::marker { color: var(--muted); }
  strong { font-weight: 600; color: #fff; }

  .note {
    border-left: 2px solid var(--accent);
    background: var(--panel);
    padding: 14px 18px;
    margin: 18px 0;
    border-radius: 0 8px 8px 0;
  }

  .table-wrap { overflow-x: auto; margin: 0 0 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 460px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }

  footer { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 24px; color: var(--muted); font-size: 14px; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 32px; padding-top: 32px; }
    nav.toc { position: static; }
    nav.toc ol { columns: 2; column-gap: 24px; }
    header.top { flex-direction: column-reverse; }
  }
  @media (max-width: 480px) { nav.toc ol { columns: 1; } body { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="bot">
        <span class="shield" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ececec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span data-k="botName"></span>
      </div>
      <h1 data-k="title"></h1>
      <p class="meta" data-k="updated"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <nav class="toc" aria-label="Contents"><ol id="toc"></ol></nav>

  <main id="content"></main>

  <footer data-k="footer"></footer>
</div>

<script>
const CONFIG = {
  brand: "HANAMI",
  contactDiscord: "@cherrystrikesback",
  email: "",
  supportServer: "https://discord.gg/month",
  termsUrl: "./terms.html",
  effective: { en: "October 11, 2026", ru: "11 октября 2026 года" },
  logRetentionDays: 30,
  removalDeletionDays: 30,
  requestReplyDays: 30,
  bots: [
    { name: "Antinuke", en: "server protection against nuke and raid attacks", ru: "защита сервера от краш- и рейд-атак" },
    { name: "Moderation", en: "server moderation against rules violators", ru: "модерация сервера от нарушителей правил" },
    { name: "Events", en: "entertaining events on server", ru: "развлекательные события на сервере" },
    { name: "Hanami", en: "server economy and utils", ru: "серверная экономика и утилиты" },
    { name: "Creative", en: "creative events on server", ru: "креативные события на сервере" }
  ]
};

const C = CONFIG;
const a = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
const botList = lang => `<ul>${C.bots.map(b => `<li><strong>${b.name}</strong> — ${b[lang]}</li>`).join("")}</ul>`;
const contact = lang => {
  const parts = [`<strong>${C.contactDiscord}</strong> ${lang === "ru" ? "в Discord" : "on Discord"}`];
  if (C.email) parts.push(`<a href="mailto:${C.email}">${C.email}</a>`);
  if (C.supportServer) parts.push(a(C.supportServer, lang === "ru" ? "сервер поддержки" : "the support server"));
  return parts.join(lang === "ru" ? ", " : ", ");
};

const T = {
  en: {
    title: "Privacy Policy",
    updated: `Effective from ${C.effective.en}`,
    lead: `This policy explains what data the ${C.brand} Discord applications process, why they need it, where it is kept and how you can ask for it to be deleted.`,
    footer: `© ${new Date().getFullYear()} ${C.brand}. The applications are not affiliated with or endorsed by Discord Inc.`,
    sections: [
      { id: "who", h: "Who processes the data", b: `
        <p>This policy covers all Discord applications (bots) operated by <strong>${C.brand}</strong>, which is responsible for running them and handling requests about data. Covered applications:</p>
        ${botList("en")}
        <p>Each application only processes the data it needs for its own features. Applications that share infrastructure do not automatically receive each other's permissions or data beyond what is required to work together.</p>
        <p>Discord processes your data independently under its own ${a("https://discord.com/privacy", "Privacy Policy")}. Our ${a(C.termsUrl, "Terms of Service")} are published separately.</p>` },
      { id: "data", h: "What data is used", b: `
        <p>Depending on the application and the features a server enables, the applications may receive the following through the Discord API, from you directly, or as a result of actions on a server:</p>
        <ul>
          <li>IDs of users, servers, channels, roles, messages and interactions.</li>
          <li>Public profile information: username, display name, avatar, server roles and membership details such as join date.</li>
          <li>Server configuration chosen by administrators: enabled modules, limits, channels, roles, whitelists.</li>
          <li>Command usage and interaction results, needed to run commands and investigate errors.</li>
          <li>Moderation and security records: who did what, when, the type of action and its reason.</li>
          <li>Support requests, appeals and any materials you attach to them.</li>
          <li>Activity, game or economy data (balances, levels, inventories), only in applications that offer these features.</li>
        </ul>
        <p>Please do not send passwords or tokens in messages to the applications or in support requests.</p>` },
      { id: "purpose", h: "Why the data is needed", b: `
        <p>Data is used to provide the features of each application, apply the settings chosen by server administrators, protect servers from abuse and attacks, handle support requests, and investigate errors or disputed actions.</p>
        <p>We do not sell user data, do not share it with advertisers and do not use it for advertising or profiling. Data is not used for purposes unrelated to the features described in this policy.</p>` },
      { id: "messages", h: "Message content", b: `
        <p>Some applications have access to message content. It is processed only within these scenarios, and only in channels the application can access:</p>
        <ul>
          <li><strong>Commands:</strong> reading text commands addressed to the application.</li>
          <li><strong>Automated protection:</strong> checking messages for spam, phishing and scam links, unauthorized invites and repeated or mass messages.</li>
          <li><strong>Logs:</strong> recording edited or deleted messages to a server's log channel, if administrators enable logging.</li>
          <li><strong>Support:</strong> forwarding messages you send to an application in DMs to the support team while your request is open.</li>
        </ul>
        <p>Unless a scenario above requires saving it, message content is checked in memory and discarded. Where it is saved, this is limited to what is needed for that scenario and to the retention periods in section 7.</p>
        <div class="note"><strong>No AI training.</strong> Message content and other data received through the Discord API are never used to train or fine-tune machine learning or AI models.</div>
        <p>The applications do not receive private messages between users. Direct messages to an application are processed only by features designed for that interaction.</p>` },
      { id: "voice", h: "Voice and presence", b: `
        <p>Applications may use voice channel join, leave and move events for features such as temporary rooms or activity counting. Voice conversations are never recorded.</p>
        <p>Unless an application's description says otherwise, the applications do not track individual online status, current games or presence history.</p>` },
      { id: "third", h: "Automated decisions and third parties", b: `
        <p>Automated checks (such as anti-spam or anti-nuke limits) can remove messages, roles or members according to server settings. If you believe an action was a mistake, contact the server's administrators or us (section 8).</p>
        <p>Data may be received by the following, only to the extent needed for the relevant feature: Discord, to deliver messages and perform actions; hosting and database providers, to run the infrastructure. Their own terms apply to processing on their side.</p>
        <p>Data may also be disclosed when required by law or by Discord to enforce its Developer Terms of Service and Developer Policy.</p>` },
      { id: "storage", h: "Where and how long data is kept", b: `
        <p>Data is stored outside Discord, in databases and caches on servers of our hosting providers, accessible only to authorized ${C.brand} staff.</p>
        <ul>
          <li><strong>Server settings and whitelists:</strong> while the application is in the server. They are deleted within ${C.removalDeletionDays} days after the application is removed.</li>
          <li><strong>Logs, caches and security records:</strong> up to ${C.logRetentionDays} days, unless needed longer to resolve a specific dispute or appeal.</li>
          <li><strong>Support requests:</strong> while needed to resolve the request, or as required by law.</li>
          <li><strong>Backups:</strong> deleted data may remain in backups until they are rotated.</li>
        </ul>
        <p>Data that is no longer needed for the feature it was collected for is deleted.</p>` },
      { id: "rights", h: "Access, correction and deletion", b: `
        <p>To request a copy of your data, correction or deletion, contact: ${contact("en")}. This also works if you are no longer a member of any server with our applications.</p>
        <p>Include in your request:</p>
        <ol>
          <li>Your Discord ID and which application or feature the request is about.</li>
          <li>What you want: a copy, correction, deletion or explanation of processing.</li>
          <li>Details that help find specific records, if relevant.</li>
        </ol>
        <p>Requests are handled manually within ${C.requestReplyDays} days. We may ask you to confirm that the account is yours, but we will never ask for your password or token.</p>
        <p>As required by Discord's Developer Policy, data received through the Discord API is deleted at the request of the user or Discord, when an application stops operating, or when it is no longer needed, except where the law requires us to keep it. Deleting data may make related features or history unavailable.</p>` },
      { id: "choices", h: "Your choices", b: `
        <p>Optional features such as support requests or games can simply not be used. Server administrators can disable modules, limit which channels an application can see, or remove the application entirely.</p>
        <p>Removing an application, restricting its permissions or blocking its DMs stops future processing, but is not the same as confirmed deletion of data already stored. Use section 8 for that.</p>` },
      { id: "security", h: "Security", b: `
        <p>Access to infrastructure and administrative functions is restricted to authorized staff with personal credentials. The applications use only official Discord APIs and never ask for passwords or personal tokens.</p>
        <p>If unauthorized access to data is detected, we will limit its impact and notify Discord and affected users where required.</p>` },
      { id: "site", h: "This website and age requirements", b: `
        <p>These pages do not require login, do not access your Discord account and do not use advertising trackers. The hosting provider may process technical data such as IP address and browser information to serve the page.</p>
        <p>The applications are intended for people who meet Discord's minimum age in their country. If you believe data of a younger user has been collected, contact us and it will be deleted.</p>` },
      { id: "changes", h: "Changes and contact", b: `
        <p>This policy is updated when features or data processing change. The effective date is shown at the top of the page. Significant changes are announced through the community's channels${C.supportServer ? " or " + a(C.supportServer, "support server") : ""}.</p>
        <p>Contact: ${contact("en")}. Related document: ${a(C.termsUrl, "Terms of Service")}.</p>` }
    ]
  },
  ru: {
    title: "Политика конфиденциальности",
    updated: `Действует с ${C.effective.ru}`,
    lead: `Эта политика объясняет, какие данные обрабатывают приложения ${C.brand} в Discord, зачем они нужны, где хранятся и как запросить их удаление.`,
    footer: `© ${new Date().getFullYear()} ${C.brand}. Приложения не связаны с Discord Inc. и не одобрены ею.`,
    sections: [
      { id: "who", h: "Кто обрабатывает данные", b: `
        <p>Политика распространяется на все приложения (ботов) Discord под управлением <strong>${C.brand}</strong>. ${C.brand} отвечает за их работу и за обращения по поводу данных. Политика охватывает:</p>
        ${botList("ru")}
        <p>Каждое приложение обрабатывает только данные, нужные для его собственных функций. Общая инфраструктура не означает, что приложения автоматически получают права и данные друг друга сверх необходимого для совместной работы.</p>
        <p>Discord обрабатывает ваши данные самостоятельно по своей ${a("https://discord.com/privacy", "политике конфиденциальности")}. Наши ${a(C.termsUrl, "условия использования")} размещены отдельно.</p>` },
      { id: "data", h: "Какие данные используются", b: `
        <p>В зависимости от приложения и включённых на сервере функций приложения могут получать через Discord API, от вас напрямую или в результате действий на сервере:</p>
        <ul>
          <li>ID пользователей, серверов, каналов, ролей, сообщений и взаимодействий.</li>
          <li>Публичные данные профиля: имя пользователя, отображаемое имя, аватар, роли на сервере, дату вступления.</li>
          <li>Настройки сервера, заданные администраторами: включённые модули, лимиты, каналы, роли, белые списки.</li>
          <li>Сведения об использовании команд и результатах взаимодействий — для выполнения команд и разбора ошибок.</li>
          <li>Записи модерации и безопасности: кто, что и когда сделал, тип действия и причина.</li>
          <li>Обращения в поддержку, обжалования и приложенные к ним материалы.</li>
          <li>Данные активности, игр или экономики (балансы, уровни, инвентарь) — только в приложениях с такими функциями.</li>
        </ul>
        <p>Не отправляйте приложениям и в обращения пароли и токены.</p>` },
      { id: "purpose", h: "Зачем нужны данные", b: `
        <p>Данные используются для работы функций приложений, применения настроек администраторов, защиты серверов от злоупотреблений и атак, обработки обращений, разбора ошибок и спорных действий.</p>
        <p>Мы не продаём данные пользователей, не передаём их рекламодателям и не используем для рекламы и профилирования. Данные не используются для целей, не связанных с описанными здесь функциями.</p>` },
      { id: "messages", h: "Содержимое сообщений", b: `
        <p>Некоторые приложения имеют доступ к содержимому сообщений. Оно обрабатывается только в следующих сценариях и только в доступных приложению каналах:</p>
        <ul>
          <li><strong>Команды:</strong> чтение текстовых команд, адресованных приложению.</li>
          <li><strong>Автоматическая защита:</strong> проверка сообщений на спам, фишинговые и мошеннические ссылки, сторонние приглашения, повторяющиеся и массовые сообщения.</li>
          <li><strong>Журналы:</strong> запись изменённых и удалённых сообщений в канал логов сервера, если администраторы включили логирование.</li>
          <li><strong>Поддержка:</strong> пересылка ваших личных сообщений приложению в команду поддержки, пока обращение открыто.</li>
        </ul>
        <p>Если сценарий не требует сохранения, содержимое проверяется в памяти и сразу удаляется. Если сохранение нужно, оно ограничено необходимым для сценария объёмом и сроками из раздела 7.</p>
        <div class="note"><strong>Без обучения ИИ.</strong> Содержимое сообщений и другие данные из Discord API никогда не используются для обучения или дообучения моделей машинного обучения и ИИ.</div>
        <p>Приложения не получают личную переписку между пользователями. Личные сообщения приложению обрабатываются только функциями, предназначенными для такого взаимодействия.</p>` },
      { id: "voice", h: "Голос и статус", b: `
        <p>Приложения могут использовать события входа, выхода и перехода между голосовыми каналами для временных комнат, учёта активности и подобных функций. Разговоры никогда не записываются.</p>
        <p>Если в описании приложения не указано иное, приложения не отслеживают статус «в сети», запущенные игры и историю присутствия.</p>` },
      { id: "third", h: "Автоматические решения и третьи лица", b: `
        <p>Автоматические проверки (например, анти-спам или лимиты анти-нюка) могут удалять сообщения, роли или участников согласно настройкам сервера. Если вы считаете действие ошибочным, обратитесь к администрации сервера или к нам (раздел 8).</p>
        <p>Данные могут получать только в объёме, нужном для функции: Discord — для доставки сообщений и выполнения действий; поставщики хостинга и баз данных — для работы инфраструктуры. К обработке на их стороне применяются их собственные условия.</p>
        <p>Данные также могут быть раскрыты по требованию закона или Discord для соблюдения Условий и Политики для разработчиков Discord.</p>` },
      { id: "storage", h: "Где и сколько хранятся данные", b: `
        <p>Данные хранятся вне Discord — в базах данных и кэшах на серверах наших поставщиков хостинга. Доступ есть только у уполномоченных сотрудников ${C.brand}.</p>
        <ul>
          <li><strong>Настройки сервера и белые списки:</strong> пока приложение находится на сервере. Удаляются в течение ${C.removalDeletionDays} дней после удаления приложения.</li>
          <li><strong>Журналы, кэши и записи безопасности:</strong> до ${C.logRetentionDays} дней, если не нужны дольше для разбора конкретного спора или обжалования.</li>
          <li><strong>Обращения:</strong> пока нужны для решения вопроса, либо в течение срока, требуемого законом.</li>
          <li><strong>Резервные копии:</strong> удалённые данные могут оставаться в них до плановой ротации.</li>
        </ul>
        <p>Данные, которые больше не нужны для функции, ради которой собраны, удаляются.</p>` },
      { id: "rights", h: "Доступ, исправление и удаление", b: `
        <p>Чтобы получить копию данных, исправить или удалить их, напишите: ${contact("ru")}. Это возможно, даже если вы больше не состоите ни на одном сервере с нашими приложениями.</p>
        <p>Укажите в запросе:</p>
        <ol>
          <li>Свой Discord ID и приложение или функцию, которых касается запрос.</li>
          <li>Что нужно: копия, исправление, удаление или пояснение по обработке.</li>
          <li>Сведения для поиска конкретных записей, если это важно.</li>
        </ol>
        <p>Запросы рассматриваются вручную в течение ${C.requestReplyDays} дней. Мы можем попросить подтвердить, что аккаунт ваш, но никогда не попросим пароль или токен.</p>
        <p>Согласно Политике для разработчиков Discord, данные из Discord API удаляются по запросу пользователя или Discord, при прекращении работы приложения или когда они больше не нужны, кроме случаев, когда хранение требуется законом. Удаление данных может сделать связанные функции или историю недоступными.</p>` },
      { id: "choices", h: "Ваш выбор", b: `
        <p>Добровольными функциями, например обращениями в поддержку или играми, можно просто не пользоваться. Администраторы сервера могут отключать модули, ограничивать доступ приложения к каналам или удалить приложение.</p>
        <p>Удаление приложения, ограничение его прав или блокировка личных сообщений прекращают дальнейшую обработку, но не равны подтверждённому удалению уже сохранённых данных. Для этого используйте раздел 8.</p>` },
      { id: "security", h: "Защита данных", b: `
        <p>Доступ к инфраструктуре и административным функциям есть только у уполномоченных сотрудников с личными учётными данными. Приложения используют только официальные API Discord и никогда не запрашивают пароли и личные токены.</p>
        <p>При обнаружении несанкционированного доступа мы ограничим последствия и уведомим Discord и затронутых пользователей в предусмотренных случаях.</p>` },
      { id: "site", h: "Этот сайт и возраст", b: `
        <p>Эти страницы не требуют входа, не получают доступ к аккаунту Discord и не используют рекламные трекеры. Хостинг может обрабатывать технические данные — IP-адрес и сведения о браузере — для показа страницы.</p>
        <p>Приложения предназначены для пользователей, достигших минимального возраста Discord в своей стране. Если вы считаете, что собраны данные пользователя младше этого возраста, сообщите нам, и они будут удалены.</p>` },
      { id: "changes", h: "Изменения и связь", b: `
        <p>Политика обновляется при изменении функций или порядка обработки данных. Дата действующей редакции указана вверху страницы. О существенных изменениях сообщается в каналах сообщества${C.supportServer ? " или на " + a(C.supportServer, "сервере поддержки") : ""}.</p>
        <p>Контакт: ${contact("ru")}. Связанный документ: ${a(C.termsUrl, "условия использования")}.</p>` }
    ]
  }
};
function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = `${t.title} — ${C.brand}`;
  document.querySelector('[data-k="botName"]').textContent = C.brand;
  document.querySelector('[data-k="title"]').textContent = t.title;
  document.querySelector('[data-k="updated"]').textContent = t.updated;
  document.querySelector('[data-k="footer"]').textContent = t.footer;
  document.getElementById("toc").innerHTML =
    t.sections.map(s => `<li><a href="#${s.id}">${s.h}</a></li>`).join("");
  document.getElementById("content").innerHTML =
    `<p class="lead">${t.lead}</p>` +
    t.sections.map(s => `<section id="${s.id}"><h2>${s.h}</h2>${s.b}</section>`).join("");
  document.querySelectorAll(".lang button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  observe();
}

let observer;
function observe() {
  if (observer) observer.disconnect();
  const links = [...document.querySelectorAll("nav.toc a")];
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
      }
    });
  }, { rootMargin: "0px 0px -70% 0px" });
  document.querySelectorAll("main section").forEach(s => observer.observe(s));
}

function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && T[s]) return s; } catch (e) {}
  return "en";
}

document.querySelectorAll(".lang button").forEach(b =>
  b.addEventListener("click", () => {
    try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
    render(b.dataset.lang);
  }));

render(initialLang());
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
